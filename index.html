<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forever Love ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

</head>

<body>



<!--==========================
BACKGROUND
===========================-->

<div id="bgGradient"></div>

<div id="stars"></div>

<div id="heartRain"></div>

<div id="floatingGlow"></div>



<!--==========================
PAGE 1
===========================-->

<section
id="page1"
class="page active">



<div class="heroContent">

<div class="logoCircle">

❤

</div>

<h1 class="mainTitle">

Forever Love

</h1>

<p class="subTitle">

Every heartbeat whispers your name...

</p>

<button
id="touchButton">

Touch Me ❤️

</button>

</div>

</section>



<!--==========================
PAGE 2
===========================-->

<section
id="page2"
class="page">



<div class="loveWorld">



<div class="treeContainer">



<div id="loveTree">



<div class="treeShadow"></div>



<div class="treeTrunk"></div>



<div class="treeBranch branch1"></div>

<div class="treeBranch branch2"></div>

<div class="treeBranch branch3"></div>

<div class="treeBranch branch4"></div>

<div class="treeBranch branch5"></div>

<div class="treeBranch branch6"></div>

<div class="treeBranch branch7"></div>

<div class="treeBranch branch8"></div>

<div class="treeBranch branch9"></div>

<div class="treeBranch branch10"></div>



<div id="heartLeaves"></div>

<div id="fallingLeaves"></div>

</div>

</div>



<div class="letterBox">

<h2>

My Letter ❤️

</h2>

<div
id="typingText">

</div>

</div>

</div>

</section>



<!--==========================
PAGE 3
===========================-->

<section
id="page3"
class="page">

<div
class="ending">



<h1>

Forever Together ❤️

</h1>

<p>

You are my forever person.

</p>



<div
id="finalHearts">

</div>



<button
id="restart">

Restart ❤️

</button>

</div>

</section>



<script
src="script.js">

</script>

</html>
